<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>span tag</title>
</head>
<body>
    <p>
  The market was busy that morning —
  <span class="time" title="time">early dawn</span>,
  <span class="mood" title="mood">electric with chatter</span>,
  and <span class="detail" title="detail">stalls piled high with spices</span>.
</p>
</body>
</html>
