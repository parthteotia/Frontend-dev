<body>
    <p>
  <strong>Morning</strong> arrived like a promise — <em>soft</em> and <mark>unexpected</mark>.<br>
  The café was small, the coffee strong, and the conversation <em>unhurried</em>.
  <small>Two sips later, everything felt possible.</small>
</p>
